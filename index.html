<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thermal Label Creator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; --secondary: #64748b; }
        body { font-family: system-ui, sans-serif; margin: 20px; background: var(--bg); padding-bottom: 50px; }
        
        .form-container { max-width: 450px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .field { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        input, textarea { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
        
        button { width: 100%; padding: 15px; border: none; border-radius: 8px; font-size: 18px; font-weight: 600; cursor: pointer; margin-top: 10px; }
        .btn-main { background: var(--primary); color: white; }

        .history-section { max-width: 450px; margin: 30px auto; }
        .history-card { background: white; padding: 12px; border-radius: 8px; margin-bottom: 8px; border-left: 5px solid var(--primary); display: flex; justify-content: space-between; align-items: center; }
        .load-btn { width: auto; padding: 8px 15px; font-size: 14px; background: var(--secondary); margin: 0; color: white; }

        /* Off-screen Label Template (102x152mm) */
        #label-to-export { 
            width: 102mm; height: 152mm; background: white; color: black;
            padding: 8mm; box-sizing: border-box; display: flex; flex-direction: column;
            position: absolute; left: -9999px; top: 0;
        }
        .label-header { display: flex; justify-content: space-between; border-bottom: 8px solid black; padding-bottom: 5px; font-size: 32px; font-weight: 900; }
        .label-room { font-size: 48px; font-weight: 800; margin: 20px 0; }
        .label-contents { font-size: 28px; flex-grow: 1; border: 4px solid black; padding: 15px; white-space: pre-wrap; }
        .fragile-banner { background: black; color: white; text-align: center; font-size: 50px; font-weight: 900; padding: 10px; margin-top: 10px; }
    </style>
</head>
<body>

<div class="form-container">
    <div class="field">
        <label>Owner / Event</label>
        <input list="owners" id="ownerInput">
        <datalist id="owners"></datalist>
    </div>
    <div class="field">
        <label>Room</label>
        <input list="rooms" id="roomInput">
        <datalist id="rooms"></datalist>
    </div>
    <div class="field" style="display:flex; align-items:center; gap:10px;">
        <input type="checkbox" id="fragileCheck" style="width:25px; height:25px;">
        <label for="fragileCheck">⚠️ FRAGILE</label>
    </div>
    <div class="field">
        <label>Contents</label>
        <textarea id="contentsInput" rows="3"></textarea>
    </div>

    <button class="btn-main" id="btnAction" onclick="generateAndShare()">Create & Share Label</button>
</div>

<div class="history-section">
    <h3>History</h3>
    <div id="history-list"></div>
</div>

<div id="label-to-export">
    <div class="label-header">
        <span id="out-owner"></span>
        <span id="out-number"></span>
    </div>
    <div class="label-room" id="out-room"></div>
    <div class="label-contents" id="out-contents"></div>
    <div id="out-fragile" class="fragile-banner">FRAGILE</div>
</div>

<script>
    const defaultOwners = ["Kevin", "Jenn", "Andrew", "Max", "Christmas", "Easter", "Halloween", "Fall", "Thanksgiving"];
    const defaultRooms = ["Living", "Kitchen", "Dining", "Bathroom", "Garage", "Bedroom", "Office", "Laundry"];

    let history = JSON.parse(localStorage.getItem('labelHistory') || '[]');
    let customOwners = JSON.parse(localStorage.getItem('customOwners') || '[]');
    let customRooms = JSON.parse(localStorage.getItem('customRooms') || '[]');

    function updateDatalists() {
        document.getElementById('owners').innerHTML = [...new Set([...defaultOwners, ...customOwners])].map(o => `<option value="${o}">`).join('');
        document.getElementById('rooms').innerHTML = [...new Set([...defaultRooms, ...customRooms])].map(r => `<option value="${r}">`).join('');
    }

    function renderHistory() {
        const list = document.getElementById('history-list');
        list.innerHTML = history.length === 0 ? '<p>No history yet.</p>' : '';
        history.slice().reverse().forEach((item, index) => {
            const realIdx = history.length - 1 - index;
            const div = document.createElement('div');
            div.className = 'history-card';
            div.innerHTML = `<div><strong>${item.owner}: ${item.room}</strong><br><small>#${item.boxNum}</small></div>
                             <button class="load-btn" onclick="loadLabel(${realIdx})">Reuse</button>`;
            list.appendChild(div);
        });
    }

    async function generateAndShare() {
        const btn = document.getElementById('btnAction');
        btn.innerText = "Processing...";
        btn.disabled = true;

        const owner = document.getElementById('ownerInput').value || 'STORAGE';
        const room = document.getElementById('roomInput').value || 'GENERAL';
        
        // Save Customs
        if(!defaultOwners.includes(owner) && !customOwners.includes(owner)) { customOwners.push(owner); localStorage.setItem('customOwners', JSON.stringify(customOwners)); }
        if(!defaultRooms.includes(room) && !customRooms.includes(room)) { customRooms.push(room); localStorage.setItem('customRooms', JSON.stringify(customRooms)); }
        updateDatalists();

        const boxNum = history.filter(item => item.owner === owner && item.room === room).length + 1;
        
        // Populate Hidden Template
        document.getElementById('out-owner').innerText = owner;
        document.getElementById('out-room').innerText = room;
        document.getElementById('out-contents').innerText = document.getElementById('contentsInput').value;
        document.getElementById('out-number').innerText = "#" + boxNum;
        document.getElementById('out-fragile').style.display = document.getElementById('fragileCheck').checked ? 'block' : 'none';

        // Convert to Image
        const canvas = await html2canvas(document.getElementById('label-to-export'), { scale: 3 });
        
        canvas.toBlob(async (blob) => {
            const file = new File([blob], `Label-${owner}-${boxNum}.png`, { type: "image/png" });
            
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                try {
                    await navigator.share({ files: [file], title: 'Label' });
                    // Only save to history if sharing was successful
                    history.push({owner, room, boxNum, contents: document.getElementById('contentsInput').value, fragile: document.getElementById('fragileCheck').checked});
                    localStorage.setItem('labelHistory', JSON.stringify(history));
                    renderHistory();
                } catch (err) {
                    console.log("Share cancelled or failed");
                }
            } else {
                alert("Browser does not support sharing files.");
            }
            
            btn.innerText = "Create & Share Label";
            btn.disabled = false;
        }, 'image/png');
    }

    function loadLabel(idx) {
        const item = history[idx];
        document.getElementById('ownerInput').value = item.owner;
        document.getElementById('roomInput').value = item.room;
        document.getElementById('contentsInput').value = item.contents;
        document.getElementById('fragileCheck').checked = item.fragile;
        window.scrollTo(0,0);
    }

    updateDatalists();
    renderHistory();
</script>
</body>
</html>
