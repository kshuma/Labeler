<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thermal Label Creator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; }
        body { font-family: system-ui, sans-serif; margin: 20px; background: var(--bg); padding-bottom: 100px; }
        
        .form-container { max-width: 450px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .field { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        input, textarea { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
        
        .btn-group { display: flex; gap: 10px; flex-direction: column; }
        button { padding: 15px; border: none; border-radius: 8px; font-size: 18px; font-weight: 600; cursor: pointer; }
        .btn-main { background: var(--primary); color: white; }
        
        /* 102x152mm Label Design */
        #label-to-export { 
            width: 102mm; height: 152mm; 
            background: white; color: black;
            padding: 8mm; box-sizing: border-box;
            display: flex; flex-direction: column;
            border: 1px solid #eee; /* Light border for screen only */
            margin: 20px auto;
        }

        .label-header { display: flex; justify-content: space-between; border-bottom: 8px solid black; padding-bottom: 5px; font-size: 32px; font-weight: 900; text-transform: uppercase; }
        .label-room { font-size: 48px; font-weight: 800; margin: 20px 0; line-height: 1; }
        .label-contents { font-size: 28px; flex-grow: 1; border: 4px solid black; padding: 15px; white-space: pre-wrap; margin-bottom: 10px; }
        .fragile-banner { background: black; color: white; text-align: center; font-size: 50px; font-weight: 900; padding: 10px; }

        /* Preview Image Area */
        #image-preview-area { text-align: center; margin-top: 30px; }
        #image-preview-area img { max-width: 90%; border: 2px solid #2563eb; border-radius: 8px; }
    </style>
</head>
<body>

<div class="form-container">
    <div class="field">
        <label>Owner / Event</label>
        <input list="owners" id="ownerInput" placeholder="Kevin, Christmas...">
        <datalist id="owners"></datalist>
    </div>
    <div class="field">
        <label>Room</label>
        <input list="rooms" id="roomInput" placeholder="Kitchen, Garage...">
        <datalist id="rooms"></datalist>
    </div>
    <div class="field" style="display:flex; align-items:center; gap:10px;">
        <input type="checkbox" id="fragileCheck" style="width:25px; height:25px;">
        <label for="fragileCheck">⚠️ FRAGILE</label>
    </div>
    <div class="field">
        <label>Contents</label>
        <textarea id="contentsInput" rows="3"></textarea>
    </div>

    <div class="btn-group">
        <button class="btn-main" onclick="generateAndCapture()">Create Label Image</button>
    </div>
</div>

<div id="label-to-export">
    <div class="label-header">
        <span id="out-owner">OWNER</span>
        <span id="out-number">#1</span>
    </div>
    <div class="label-room" id="out-room">ROOM</div>
    <div class="label-contents" id="out-contents">Contents...</div>
    <div id="out-fragile" class="fragile-banner">FRAGILE</div>
</div>

<div id="image-preview-area">
    <p id="instruction" style="display:none;"><strong>Long-press the image below to Save or Share to your Printer App:</strong></p>
    <div id="image-container"></div>
</div>

<script>
    const defaultOwners = ["Kevin", "Jenn", "Andrew", "Max", "Christmas", "Easter", "Halloween", "Fall", "Thanksgiving"];
    const defaultRooms = ["Living", "Kitchen", "Dining", "Bathroom", "Garage", "Bedroom", "Office", "Laundry"];

    let history = JSON.parse(localStorage.getItem('labelHistory') || '[]');
    let customOwners = JSON.parse(localStorage.getItem('customOwners') || '[]');
    let customRooms = JSON.parse(localStorage.getItem('customRooms') || '[]');

    function updateDatalists() {
        document.getElementById('owners').innerHTML = [...new Set([...defaultOwners, ...customOwners])].map(o => `<option value="${o}">`).join('');
        document.getElementById('rooms').innerHTML = [...new Set([...defaultRooms, ...customRooms])].map(r => `<option value="${r}">`).join('');
    }

    async function generateAndCapture() {
        const owner = document.getElementById('ownerInput').value || 'STORAGE';
        const room = document.getElementById('roomInput').value || 'GENERAL';
        
        // Save customs
        if(!defaultOwners.includes(owner) && !customOwners.includes(owner)) { customOwners.push(owner); localStorage.setItem('customOwners', JSON.stringify(customOwners)); }
        if(!defaultRooms.includes(room) && !customRooms.includes(room)) { customRooms.push(room); localStorage.setItem('customRooms', JSON.stringify(customRooms)); }
        updateDatalists();

        const boxNum = history.filter(item => item.owner === owner && item.room === room).length + 1;

        // Update Label Text
        document.getElementById('out-owner').innerText = owner;
        document.getElementById('out-room').innerText = room;
        document.getElementById('out-contents').innerText = document.getElementById('contentsInput').value;
        document.getElementById('out-number').innerText = "#" + boxNum;
        document.getElementById('out-fragile').style.display = document.getElementById('fragileCheck').checked ? 'block' : 'none';

        // Convert to Image
        const labelEl = document.getElementById('label-to-export');
        const canvas = await html2canvas(labelEl, { scale: 3 }); // High scale for crisp thermal printing
        
        const imgData = canvas.toDataURL("image/png");
        const container = document.getElementById('image-container');
        container.innerHTML = `<img src="${imgData}" id="final-label-img">`;
        document.getElementById('instruction').style.display = 'block';

        // Save to history
        history.push({owner, room, boxNum, contents: document.getElementById('contentsInput').value});
        localStorage.setItem('labelHistory', JSON.stringify(history));

        // Scroll to image
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }

    updateDatalists();
</script>

</body>
</html>
