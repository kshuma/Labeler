<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Labeler</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root { --primary: #2563eb; --bg: #f1f5f9; }
        body { font-family: -apple-system, sans-serif; margin: 15px; background: var(--bg); color: #1e293b; }
        
        .form-container { max-width: 450px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .field { margin-bottom: 12px; }
        label { display: block; font-weight: bold; margin-bottom: 4px; font-size: 13px; color: #64748b; }
        input, textarea { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
        
        button { width: 100%; padding: 16px; border: none; border-radius: 8px; font-size: 18px; font-weight: 700; cursor: pointer; }
        .btn-main { background: var(--primary); color: white; margin-top: 10px; }
        .btn-danger { background: #ef4444; color: white; margin-top: 50px; font-size: 14px; padding: 10px; }

        /* PREVIEW AREA */
        .preview-wrapper { display: flex; justify-content: center; margin: 25px 0; overflow: hidden; }
        #label-to-export { 
            width: 102mm; height: 152mm; background: white; color: black;
            padding: 8mm; box-sizing: border-box; display: flex; flex-direction: column;
            border: 1px solid #000; position: relative;
        }
        .label-header { display: flex; justify-content: space-between; border-bottom: 8px solid black; padding-bottom: 5px; font-size: 32px; font-weight: 900; }
        .label-room { font-size: 44px; font-weight: 800; margin: 15px 0; line-height: 1.1; word-wrap: break-word; }
        .label-contents { font-size: 24px; flex-grow: 1; border: 4px solid black; padding: 12px; white-space: pre-wrap; overflow: hidden; }
        .fragile-banner { background: black; color: white; text-align: center; font-size: 48px; font-weight: 900; padding: 10px; margin-top: 10px; }

        .history-section { max-width: 450px; margin: 30px auto; }
        .history-card { background: white; padding: 12px; border-radius: 8px; margin-bottom: 8px; border-left: 5px solid var(--primary); display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
        .load-btn { width: auto; padding: 8px 12px; background: #64748b; color: white; font-weight: 600; margin: 0; }

        @media (max-width: 500px) { #label-to-export { transform: scale(0.75); transform-origin: top center; margin-bottom: -40mm; } }
    </style>
</head>
<body>

<div class="form-container">
    <div class="field">
        <label>OWNER / EVENT</label>
        <input list="owners" id="ownerInput" oninput="updatePreview()">
        <datalist id="owners"></datalist>
    </div>
    <div class="field">
        <label>ROOM</label>
        <input list="rooms" id="roomInput" oninput="updatePreview()">
        <datalist id="rooms"></datalist>
    </div>
    <div class="field" style="display:flex; align-items:center; gap:12px; padding: 5px 0;">
        <input type="checkbox" id="fragileCheck" style="width:24px; height:24px;" onchange="updatePreview()">
        <label for="fragileCheck" style="margin:0; color: #1e293b;">⚠️ MARK AS FRAGILE</label>
    </div>
    <div class="field">
        <label>BOX CONTENTS</label>
        <textarea id="contentsInput" rows="3" oninput="updatePreview()"></textarea>
    </div>
    <button class="btn-main" id="btnAction" onclick="generatePDF()">Create & Save PDF</button>
</div>

<div class="preview-wrapper">
    <div id="label-to-export">
        <div class="label-header">
            <span id="out-owner">OWNER</span>
            <span id="out-number">#1</span>
        </div>
        <div class="label-room" id="out-room">ROOM</div>
        <div id="out-contents" class="label-contents">Contents...</div>
        <div id="out-fragile" class="fragile-banner">FRAGILE</div>
    </div>
</div>

<div class="history-section">
    <h3>History</h3>
    <div id="history-list"></div>
    <button class="btn-danger" onclick="clearAllData()">Wipe All Saved Data</button>
</div>

<script>
    let history = JSON.parse(localStorage.getItem('labelHistory') || '[]');
    let customOwners = JSON.parse(localStorage.getItem('customOwners') || '[]');
    let customRooms = JSON.parse(localStorage.getItem('customRooms') || '[]');

    function updateDatalists() {
        const defaults = {
            owners: ["Kevin", "Jenn", "Andrew", "Max", "Christmas", "Easter", "Halloween", "Fall", "Thanksgiving"],
            rooms: ["Living", "Kitchen", "Dining", "Bathroom", "Garage", "Bedroom", "Office", "Laundry"]
        };
        document.getElementById('owners').innerHTML = [...new Set([...defaults.owners, ...customOwners])].map(o => `<option value="${o}">`).join('');
        document.getElementById('rooms').innerHTML = [...new Set([...defaults.rooms, ...customRooms])].map(r => `<option value="${r}">`).join('');
    }

    function updatePreview() {
        const owner = document.getElementById('ownerInput').value || 'OWNER';
        const room = document.getElementById('roomInput').value || 'ROOM';
        const boxNum = history.filter(item => item.owner === owner && item.room === room).length + 1;

        document.getElementById('out-owner').innerText = owner.toUpperCase();
        document.getElementById('out-room').innerText = room.toUpperCase();
        document.getElementById('out-contents').innerText = document.getElementById('contentsInput').value;
        document.getElementById('out-number').innerText = "#" + boxNum;
        document.getElementById('out-fragile').style.display = document.getElementById('fragileCheck').checked ? 'block' : 'none';
    }

    async function generatePDF() {
        const btn = document.getElementById('btnAction');
        btn.innerText = "Processing...";
        btn.disabled = true;

        const owner = document.getElementById('ownerInput').value || 'STORAGE';
        const room = document.getElementById('roomInput').value || 'GENERAL';
        
        // Save customs
        if(owner && !customOwners.includes(owner)) { customOwners.push(owner); localStorage.setItem('customOwners', JSON.stringify(customOwners)); }
        if(room && !customRooms.includes(room)) { customRooms.push(room); localStorage.setItem('customRooms', JSON.stringify(customRooms)); }
        updateDatalists();

        const boxNum = history.filter(item => item.owner === owner && item.room === room).length + 1;
        updatePreview();

        const element = document.getElementById('label-to-export');
        
        // Nelko-specific PDF settings
        const opt = {
            margin: 0,
            filename: `Box-${owner}-${boxNum}.pdf`,
            image: { type: 'jpeg', quality: 1 },
            html2canvas: { 
                scale: 4, 
                logging: false, 
                useCORS: true,
                windowWidth: 385, // 102mm in pixels
                windowHeight: 575 // 152mm in pixels
            },
            jsPDF: { unit: 'mm', format: [102, 152], orientation: 'portrait' }
        };

        // Added delay to allow Safari to finish rendering text
        setTimeout(async () => {
            try {
                await html2pdf().set(opt).from(element).save();
                history.push({owner, room, boxNum, contents: document.getElementById('contentsInput').value, fragile: document.getElementById('fragileCheck').checked});
                localStorage.setItem('labelHistory', JSON.stringify(history));
                renderHistory();
            } catch (e) {
                alert("Generation failed. Please try again.");
            }
            btn.innerText = "Create & Save PDF";
            btn.disabled = false;
        }, 300);
    }

    function renderHistory() {
        const list = document.getElementById('history-list');
        list.innerHTML = history.length === 0 ? '<p style="color:#64748b">No history yet.</p>' : '';
        history.slice().reverse().slice(0, 10).forEach((item, index) => {
            const realIdx = history.length - 1 - index;
            const div = document.createElement('div');
            div.className = 'history-card';
            div.innerHTML = `<div><strong>${item.owner}: ${item.room}</strong><br><span>Box #${item.boxNum}</span></div>
                             <button class="load-btn" onclick="loadLabel(${realIdx})">Reuse</button>`;
            list.appendChild(div);
        });
    }

    function loadLabel(idx) {
        const item = history[idx];
        document.getElementById('ownerInput').value = item.owner;
        document.getElementById('roomInput').value = item.room;
        document.getElementById('contentsInput').value = item.contents;
        document.getElementById('fragileCheck').checked = item.fragile;
        updatePreview();
        window.scrollTo({top: 0, behavior: 'smooth'});
    }

    function clearAllData() {
        if(confirm("Delete all history and custom categories? This cannot be undone.")) {
            localStorage.clear();
            location.reload();
        }
    }

    updateDatalists();
    renderHistory();
    updatePreview();
</script>
</body>
</html>
